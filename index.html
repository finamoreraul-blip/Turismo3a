<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TresaMarket | Marketplace Local</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f766e',
                        secondary: '#e2e8f0',
                        dark: '#1e293b',
                        bglight: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%; max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0;
            box-sizing: border-box; font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        *, *:before, *:after { box-sizing: inherit; max-width: 100%; }
        .modal-box { width: 95%; max-width: 450px; margin: auto; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (max-width: 768px) {
            .ml-responsive-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 8px !important; }
        }
        @media (min-width: 769px) {
            .ml-responsive-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 16px !important; }
        }

        .ml-product-card {
            background: #ffffff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: all 150ms ease-in-out; border: 1px solid #f1f5f9;
        }
        .ml-product-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.12); transform: translateY(-2px); }
        .ml-product-img-container { width: 100%; aspect-ratio: 1/1; background: #f8fafc; position: relative; overflow: hidden; }
        .ml-product-img { width: 100%; height: 100%; object-fit: cover; }
        .ml-product-info { padding: 10px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .ml-product-title {
            font-size: 13px; font-weight: 500; color: #334155;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
        }
        .ml-product-price { font-size: 16px; font-weight: 700; color: #0f766e; }

        @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .skeleton { background: #e2e8f0; animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-bglight text-dark min-h-screen flex flex-col">

    <div id="sync-bar" class="bg-slate-800 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50">
        <span id="sync-status-text">○ Cargando datos...</span>
        <button onclick="manualSync()" class="underline text-teal-300">Actualizar</button>
    </div>

    <div id="app" class="flex-1 flex flex-col w-full"></div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6sUbdfJ23AOKNC0hwfGMWTeZ-9Ck4LpgeT4aEGmwm5SA3GVqtj-PGFBjx7PQh7ONWuA/exec";
        const CENTRAL_WSP = "5492983389710";

        let cachedData = JSON.parse(localStorage.getItem('tresamarket_cache') || 'null');
        let sessionObj = JSON.parse(localStorage.getItem('tresamarket_session') || 'null');

        let state = {
            productos: cachedData ? cachedData.productos : [],
            pedidos: cachedData ? cachedData.pedidos : [],
            usuarios: cachedData ? cachedData.usuarios : [],
            session: sessionObj,
            activeCategory: 'Todos',
            searchQuery: '',
            authTab: 'login',
            authModalOpen: false,
            selectedProductModal: null,
            editingProduct: null,
            checkoutData: { cant: 1, cliente: '', direccion: '', nota: '', flash: false },
            currentView: 'catalogo',
            activeLocalName: null,
            isSubmitting: false,
            isLoading: !cachedData
        };

        window.allData = cachedData || { productos: [], pedidos: [], usuarios: [] };

        // Normalización y conversión de imagen a JPG mediante Canvas para evitar errores de tipo MIME / HEIC
        async function uploadImageToDrive(file) {
            if (!file) return '';
            if (typeof file === 'string') return file;
            try {
                const base64Data = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            
                            const MAX_WIDTH = 1200;
                            const MAX_HEIGHT = 1200;
                            if (width > height) {
                                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                            } else {
                                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                            }
                            
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            resolve(canvas.toDataURL('image/jpeg', 0.85));
                        };
                        img.onerror = () => resolve(e.target.result);
                    };
                    reader.onerror = () => resolve('');
                });

                if (!base64Data) return '';
                const base64Clean = base64Data.includes(',') ? base64Data.split(',')[1] : base64Data;

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'uploadImage',
                        name: (file.name ? file.name.split('.')[0] : 'foto') + '.jpg',
                        base64: base64Clean,
                        type: 'image/jpeg'
                    })
                });
                const data = await response.json();
                if (data && data.status === 'success' && data.url) return data.url;
            } catch (err) {
                console.error("Error subiendo imagen:", err);
            }
            return '';
        }

        async function uploadMultipleImages(fileList, maxCount = 4) {
            let files = Array.from(fileList).slice(0, maxCount);
            let urls = [];
            for (let f of files) {
                let url = await uploadImageToDrive(f);
                if (url) urls.push(url);
            }
            return urls;
        }

        const CATEGORIES = ['Todos', 'Alimentos', 'Servicios', 'Indumentaria', 'Hogar y Deco', 'Belleza', 'Oficios', 'Tecnología', 'Vehículos'];

        function fetchData(force = false) {
            return fetch(SCRIPT_URL + '?_=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(data => {
                window.allData = data;
                localStorage.setItem('tresamarket_cache', JSON.stringify(data));
                state.productos = data.productos || [];
                state.pedidos = data.pedidos || [];
                state.usuarios = data.usuarios || [];
                state.isLoading = false;
                updateSyncBar(true);
                render();
                return data;
            }).catch(err => {
                console.error("Error sync:", err);
                updateSyncBar(false);
                return null;
            });
        }

        function updateSyncBar(online) {
            const bar = document.getElementById('sync-bar');
            const txt = document.getElementById('sync-status-text');
            if (!bar || !txt) return;
            bar.className = online ? "bg-teal-800 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50" : "bg-amber-700 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50";
            txt.innerHTML = online ? "● Conectado con Sheets (TresaMarket)" : "○ Modo Offline (Caché)";
        }

        function manualSync() {
            showToast("Sincronizando con TresaMarket...");
            fetchData(true);
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const t = document.createElement('div');
            t.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm transition-all transform translate-y-2 opacity-0 ${type === 'error' ? 'bg-rose-600' : 'bg-teal-700'}`;
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => t.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => { t.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        let carouselIntervals = {};
        function startCarousels() {
            Object.values(carouselIntervals).forEach(clearInterval);
            carouselIntervals = {};
            document.querySelectorAll('.carousel-container').forEach(container => {
                const id = container.dataset.carouselId;
                const slides = container.querySelectorAll('.carousel-slide');
                const dots = container.querySelectorAll('.carousel-dot');
                if (slides.length <= 1) return;
                let currentIndex = 0;
                const showSlide = (idx) => {
                    slides.forEach((s, i) => { s.style.display = (i === idx) ? 'block' : 'none'; });
                    dots.forEach((d, i) => { d.className = (i === idx) ? 'carousel-dot w-2 h-2 rounded-full bg-white scale-110 transition-all' : 'carousel-dot w-2 h-2 rounded-full bg-white/50 transition-all'; });
                };
                showSlide(0);
                carouselIntervals[id] = setInterval(() => {
                    currentIndex = (currentIndex + 1) % slides.length;
                    showSlide(currentIndex);
                }, 3500);
            });
        }

        function nextSlide(id) {
            const container = document.querySelector(`[data-carousel-id="${id}"]`);
            if(!container) return;
            const slides = container.querySelectorAll('.carousel-slide');
            const dots = container.querySelectorAll('.carousel-dot');
            let current = Array.from(slides).findIndex(s => s.style.display === 'block');
            if(current === -1) current = 0;
            let next = (current + 1) % slides.length;
            slides.forEach((s, i) => { s.style.display = (i === next) ? 'block' : 'none'; });
            dots.forEach((d, i) => { d.className = (i === next) ? 'carousel-dot w-2 h-2 rounded-full bg-white scale-110 transition-all' : 'carousel-dot w-2 h-2 rounded-full bg-white/50 transition-all'; });
        }

        function prevSlide(id) {
            const container = document.querySelector(`[data-carousel-id="${id}"]`);
            if(!container) return;
            const slides = container.querySelectorAll('.carousel-slide');
            const dots = container.querySelectorAll('.carousel-dot');
            let current = Array.from(slides).findIndex(s => s.style.display === 'block');
            if(current === -1) current = 0;
            let prev = (current - 1 + slides.length) % slides.length;
            slides.forEach((s, i) => { s.style.display = (i === prev) ? 'block' : 'none'; });
            dots.forEach((d, i) => { d.className = (i === prev) ? 'carousel-dot w-2 h-2 rounded-full bg-white scale-110 transition-all' : 'carousel-dot w-2 h-2 rounded-full bg-white/50 transition-all'; });
        }

        function handleRoute() {
            const hash = window.location.hash;
            if (hash.startsWith('#local/')) {
                state.currentView = 'catalogo-local';
                state.activeLocalName = decodeURIComponent(hash.replace('#local/', ''));
            } else if (hash.startsWith('#mi-panel')) {
                state.currentView = 'mi-panel';
            } else if (hash.startsWith('#mis-productos')) {
                state.currentView = 'mis-productos';
            } else {
                state.currentView = 'catalogo';
                state.activeLocalName = null;
            }
            render();
        }

        window.addEventListener('hashchange', handleRoute);

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            let html = '';
            if (state.currentView === 'mi-panel') html = renderMiPanel();
            else if (state.currentView === 'mis-productos') html = renderMisProductos();
            else if (state.currentView === 'catalogo-local') html = renderCatalogoLocalView();
            else html = renderGeneralCatalogView();

            html += renderModals();
            app.innerHTML = html;
            startCarousels();
        }

        function renderGeneralCatalogView() {
            let filtered = state.productos.filter(p => p.activo !== false && p.activo !== 'false');
            if (state.activeCategory !== 'Todos') filtered = filtered.filter(p => p.categoria === state.activeCategory);
            if (state.searchQuery.trim()) {
                const q = state.searchQuery.toLowerCase();
                filtered = filtered.filter(p => p.nombre.toLowerCase().includes(q) || (p.descripcion && p.descripcion.toLowerCase().includes(q)));
            }

            filtered.sort((a, b) => {
                let aFlash = a.tieneFlash === true || a.tieneFlash === 'true' || a.tieneFlash === 'TRUE';
                let bFlash = b.tieneFlash === true || b.tieneFlash === 'true' || b.tieneFlash === 'TRUE';
                return (bFlash ? 1 : 0) - (aFlash ? 1 : 0);
            });

            return `
                <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
                    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
                        <a href="#" class="text-xl font-bold text-teal-800">🛒 TresaMarket</a>
                        <div class="w-full sm:w-96">
                            <input type="text" placeholder="Buscá productos, servicios..." value="${state.searchQuery}" oninput="state.searchQuery = this.value; render();" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none">
                        </div>
                        <div>
                            ${state.session ? `<a href="#mi-panel" class="bg-teal-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold">Mi Panel</a>` : `<button onclick="openAuthModal('login')" class="bg-teal-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold">Ingresar / Registrarse</button>`}
                        </div>
                    </div>
                    <div class="max-w-6xl mx-auto px-4 py-2 overflow-x-auto no-scrollbar flex gap-2 border-t border-slate-100">
                        ${CATEGORIES.map(cat => `<button onclick="state.activeCategory = '${cat}'; render();" class="whitespace-nowrap px-4 py-1.5 rounded-xl text-xs font-semibold ${state.activeCategory === cat ? 'bg-teal-700 text-white' : 'bg-slate-100 text-slate-700'}">${cat}</button>`).join('')}
                    </div>
                </header>
                <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-4">
                    <div class="bg-gradient-to-r from-teal-800 to-teal-900 rounded-3xl p-6 text-white shadow-md flex justify-between items-center">
                        <div>
                            <span class="bg-teal-700 text-teal-200 text-xs px-3 py-1 rounded-full font-semibold">📍 TresaMarket</span>
                            <h1 class="text-2xl font-extrabold mt-2">Marketplace Local</h1>
                            <p class="text-teal-100 text-xs mt-1">Comprá directo a los emprendedores de la zona.</p>
                        </div>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800">Catálogo General (${filtered.length})</h2>
                    <div class="grid ml-responsive-grid">
                        ${filtered.map(p => renderProductCard(p)).join('')}
                    </div>
                </main>
            `;
        }

        function renderProductCard(p) {
            let fotos = ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'];
            try {
                if (p.fotos) { let parsed = typeof p.fotos === 'string' ? JSON.parse(p.fotos) : p.fotos; if (parsed.length > 0) fotos = parsed; }
            } catch(e){}
            let isFlash = p.tieneFlash === true || p.tieneFlash === 'true' || p.tieneFlash === 'TRUE';

            return `
                <div onclick="openProductModal('${p.id}')" class="ml-product-card relative">
                    ${isFlash ? `<span class="absolute top-2 right-2 bg-amber-500 text-white text-[10px] px-2 py-0.5 rounded-lg font-extrabold z-10 shadow">⚡ FLASH</span>` : ''}
                    <div class="ml-product-img-container">
                        <img src="${fotos[0]}" loading="lazy" class="ml-product-img">
                        <span class="absolute top-2 left-2 bg-teal-900/80 text-white text-[10px] px-2 py-0.5 rounded-lg">${p.categoria}</span>
                    </div>
                    <div class="ml-product-info">
                        <div>
                            <span class="text-[11px] text-teal-700 font-semibold block truncate">Vendido por: ${p.vendorLocal || p.vendorNombre || 'Local'}</span>
                            <h3 class="ml-product-title mt-0.5">${p.nombre}</h3>
                        </div>
                        <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between">
                            <span class="ml-product-price">$${Number(p.precio).toLocaleString('es-AR')}</span>
                            <span class="text-xs bg-teal-50 text-teal-800 px-2 py-1 rounded-xl font-semibold">Ver</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCatalogoLocalView() {
            let localName = state.activeLocalName;
            let prods = state.productos.filter(p => String(p.vendorLocal || '').toLowerCase() === String(localName || '').toLowerCase() && p.activo !== false && p.activo !== 'false');
            let vendedorUser = state.usuarios.find(u => String(u.nombreLocal || '').toLowerCase() === String(localName || '').toLowerCase()) || {};

            return `
                <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
                    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                        <a href="#" class="text-teal-800 text-xs font-bold">← Volver al market</a>
                        <span class="text-sm font-bold text-slate-700">Catálogo de ${localName}</span>
                        <a href="https://wa.me/549${vendedorUser.wsp || CENTRAL_WSP}" target="_blank" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded-xl font-bold">WhatsApp</a>
                    </div>
                </header>
                <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex items-center gap-4">
                        <div class="w-16 h-16 rounded-2xl bg-teal-700 text-white flex items-center justify-center font-extrabold text-2xl shadow-inner">
                            ${localName.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h1 class="text-xl font-extrabold text-slate-900">${localName}</h1>
                            <p class="text-xs text-teal-800 font-semibold mt-1">📞 +54 9 ${vendedorUser.wsp || 'Consultar'}</p>
                        </div>
                    </div>
                    <h2 class="text-lg font-bold text-slate-900">Catálogo de ${localName} (${prods.length})</h2>
                    <div class="grid ml-responsive-grid">
                        ${prods.map(p => renderProductCard(p)).join('')}
                    </div>
                </main>
            `;
        }

        function renderMiPanel() {
            if (!state.session) return `<div class="p-12 text-center"><p>Iniciá sesión para ver tu panel.</p><button onclick="openAuthModal('login')" class="mt-3 bg-teal-700 text-white px-4 py-2 rounded-xl">Ingresar</button></div>`;
            const myOrders = state.pedidos.filter(o => o.vendorEmail === state.session.email);
            let currentUser = state.usuarios.find(u => u.email === state.session.email) || {};

            return `
                <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
                    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                        <a href="#" class="text-teal-800 text-xs font-bold">← Volver al Market</a>
                        <button onclick="logout()" class="bg-rose-50 text-rose-700 text-xs px-3 py-2 rounded-xl font-bold">Cerrar Sesión</button>
                    </div>
                </header>
                <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                        <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">● Vendedor Activo</span>
                        <h1 class="text-2xl font-extrabold text-slate-900">${state.session.nombre}</h1>
                        
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">🏪 Mi Emprendimiento</h3>
                            <form onsubmit="handleSaveLocalName(event)" class="flex gap-2">
                                <input type="text" name="nombreLocal" value="${currentUser.nombreLocal || ''}" required placeholder="Ej: Aura Beauty" class="bg-white border rounded-xl px-4 py-2.5 text-sm flex-1 focus:outline-none">
                                <button type="submit" class="bg-teal-700 hover:bg-teal-800 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow transition">Guardar Local</button>
                            </form>
                            <p class="text-[11px] text-slate-500">Este es el nombre con el que tus productos aparecerán publicados en TresaMarket.</p>
                        </div>

                        <div class="pt-2 flex justify-between items-center">
                            <a href="#mis-productos" class="bg-teal-700 hover:bg-teal-800 text-white text-xs px-5 py-3 rounded-2xl font-bold shadow transition block text-center">📦 Administrar Mis Productos</a>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                        <h3 class="text-base font-bold text-slate-900">📋 Pedidos Recibidos (${myOrders.length})</h3>
                        ${myOrders.length === 0 ? `<p class="text-xs text-slate-500">No hay pedidos aún.</p>` : myOrders.map(o => {
                            let isFlashOrder = o.flash === true || o.flash === 'true' || o.flash === 'TRUE';
                            let comision10 = isFlashOrder ? (Number(o.subtotal) * 0.10) : 0;
                            return `
                                <div class="p-4 bg-slate-50 rounded-2xl border text-xs space-y-2">
                                    <div class="font-bold text-sm text-slate-800 flex justify-between">
                                        <span>📦 ${o.productoNombre} x${o.cantidad}</span>
                                        <span class="text-teal-800">$${Number(o.totalCliente || o.subtotal).toLocaleString('es-AR')}</span>
                                    </div>
                                    <div><b>Cliente:</b> ${o.cliente} | <b>Dir:</b> ${o.direccion}</div>
                                    ${isFlashOrder ? `
                                        <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-amber-900 space-y-1">
                                            <b>⚡ Detalle Servicio Flash (Para el Vendedor):</b><br>
                                            • Total cobrado al cliente (producto + $2.000 envío): <b>$${Number(o.totalCliente).toLocaleString('es-AR')}</b><br>
                                            • Tu comisión a pagar a TresaMarket (10% del producto): <b class="text-rose-700">$${comision10.toLocaleString('es-AR')}</b>
                                        </div>
                                    ` : '<div><b>Envío:</b> Propio del local</div>'}
                                    ${o.nota ? `<div><b>Nota:</b> ${o.nota}</div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </main>
            `;
        }

        function renderMisProductos() {
            if (!state.session) { window.location.hash = ''; return ''; }
            const myProds = state.productos.filter(p => p.vendorEmail === state.session.email);
            let editP = state.editingProduct;

            return `
                <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
                    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                        <a href="#mi-panel" class="text-teal-800 text-xs font-bold">← Volver al Panel</a>
                        <button onclick="logout()" class="bg-rose-50 text-rose-700 text-xs px-3 py-2 rounded-xl font-bold">Cerrar Sesión</button>
                    </div>
                </header>
                <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border space-y-4">
                        <h2 class="text-lg font-bold">${editP ? '✏️ Editar Producto' : '➕ Agregar Producto (Hasta 4 fotos)'}</h2>
                        
                        <form onsubmit="handleSaveProduct(event)" class="space-y-3">
                            <input type="hidden" name="id" value="${editP ? editP.id : ''}">
                            <div><label class="text-xs font-semibold">Nombre del Producto</label><input type="text" name="nombre" value="${editP ? editP.nombre : ''}" required class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-xs font-semibold">Precio ARS</label><input type="number" name="precio" value="${editP ? editP.precio : ''}" required class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                                <div><label class="text-xs font-semibold">Categoría</label><select name="categoria" class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1">${CATEGORIES.filter(c=>c!=='Todos').map(c=>`<option value="${c}" ${editP && editP.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
                            </div>
                            <div><label class="text-xs font-semibold">Descripción</label><textarea name="descripcion" rows="2" class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1">${editP ? (editP.descripcion||'') : ''}</textarea></div>
                            <div><label class="text-xs font-semibold">Fotos (Seleccioná hasta 4)</label><input type="file" name="fotos" accept="image/*" multiple id="prod-fotos-input" class="w-full bg-slate-50 border rounded-2xl px-3 py-2 text-xs mt-1"></div>
                            
                            <div class="bg-slate-50 border rounded-2xl p-4 space-y-2">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" name="tieneFlash" id="tieneFlash-chk" ${editP && (editP.tieneFlash===true||editP.tieneFlash==='true'||editP.tieneFlash==='TRUE')?'checked':''} class="w-4 h-4 text-teal-700">
                                    <label for="tieneFlash-chk" class="text-xs font-bold text-slate-800 cursor-pointer">⚡ Es Servicio Flash (entrega rápida / en el día)</label>
                                </div>
                                <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-[11px] text-amber-900 leading-relaxed">
                                    <b>¿Cómo funciona Flash? ⚡</b><br>
                                    Si activás Flash, tu producto se destaca con etiqueta FLASH y aparece primero en el catálogo. <b>ATENCIÓN:</b> A vos como vendedor te cobramos 10% de comisión por cada pedido Flash que recibas. Al comprador solo se le cobra $2.000 de envío. El comprador NUNCA ve lo del 10%. Vos decidís si te conviene activarlo.
                                </div>
                            </div>

                            <div class="flex gap-2">
                                <button type="submit" id="btn-submit-prod" class="flex-1 h-12 bg-teal-700 text-white font-bold rounded-2xl text-sm transition">${editP ? 'Actualizar Producto' : 'Publicar Producto'}</button>
                                ${editP ? `<button type="button" onclick="state.editingProduct=null;render();" class="bg-slate-200 px-4 rounded-2xl text-xs font-bold">Cancelar</button>` : ''}
                            </div>
                        </form>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border space-y-3">
                        <h3 class="text-base font-bold">📦 Mis Productos Publicados (${myProds.length})</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${myProds.map(p => {
                                let f = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100';
                                try { let parsed = typeof p.fotos === 'string' ? JSON.parse(p.fotos) : p.fotos; if(parsed.length > 0) f = parsed[0]; } catch(e){}
                                return `
                                    <div class="border rounded-2xl p-3 flex items-center justify-between bg-slate-50">
                                        <div class="flex items-center gap-3">
                                            <img src="${f}" class="w-12 h-12 rounded-xl object-cover">
                                            <div>
                                                <h4 class="text-xs font-bold">${p.nombre}</h4>
                                                <span class="text-xs text-teal-800 font-bold">$${Number(p.precio).toLocaleString('es-AR')}</span>
                                            </div>
                                        </div>
                                        <div class="flex gap-1.5">
                                            <button onclick="startEditProduct('${p.id}')" class="text-xs bg-teal-50 text-teal-800 px-3 py-1.5 rounded-xl font-bold">Editar</button>
                                            <button onclick="deleteProduct('${p.id}')" class="text-xs bg-rose-50 text-rose-700 px-3 py-1.5 rounded-xl font-bold">Borrar</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </main>
            `;
        }

        async function handleSaveLocalName(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const nombreLocal = fd.get('nombreLocal').trim();
            if (!nombreLocal) return;

            let u = state.usuarios.find(x => x.email === state.session.email) || {};
            u.nombreLocal = nombreLocal;
            u.action = 'guardar_mi_local';

            showToast("Guardando nombre de local...");
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams(u) });
            showToast("Nombre de local guardado exitosamente ✓");
            setTimeout(() => fetchData(true), 1500);
        }

        async function handleSaveProduct(e) {
            e.preventDefault();
            if (!state.session) return;

            let currentUser = state.usuarios.find(u => u.email === state.session.email) || {};
            if (!currentUser.nombreLocal) {
                showToast("Primero configurá el nombre de tu local en tu panel", "error");
                window.location.hash = '#mi-panel';
                return;
            }

            const fd = new FormData(e.target);
            const nombre = fd.get('nombre').trim();
            const precio = Number(fd.get('precio'));
            const categoria = fd.get('categoria');
            const descripcion = fd.get('descripcion');
            const tieneFlash = document.getElementById('tieneFlash-chk').checked;
            const productId = fd.get('id') || ('prod_' + Date.now());

            if (nombre.length < 3) {
                showToast("El nombre del producto debe tener al menos 3 letras", "error");
                return;
            }

            const filesInput = document.getElementById('prod-fotos-input');
            let fotosArr = [];

            const btnSubmit = document.getElementById('btn-submit-prod');
            if (btnSubmit) {
                btnSubmit.disabled = true;
                btnSubmit.innerText = "Subiendo...";
            }

            try {
                if (filesInput && filesInput.files.length > 0) {
                    showToast("Subiendo fotos a Google Drive...");
                    fotosArr = await uploadMultipleImages(filesInput.files, 4);
                }

                if (state.editingProduct) {
                    let oldFotos = [];
                    try {
                        oldFotos = typeof state.editingProduct.fotos === 'string' ? JSON.parse(state.editingProduct.fotos) : state.editingProduct.fotos;
                    } catch(e){}
                    fotosArr = fotosArr.length > 0 ? fotosArr : oldFotos;
                }

                if (!fotosArr || fotosArr.length === 0) {
                    showToast("Debes subir al menos 1 foto válida", "error");
                    if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerText = "Publicar Producto"; }
                    return;
                }

                const prod = {
                    action: state.editingProduct ? 'actualizar_producto' : 'crear_producto',
                    id: productId,
                    vendorEmail: state.session.email,
                    vendorNombre: state.session.nombre,
                    vendorLocal: currentUser.nombreLocal,
                    nombre,
                    precio,
                    categoria,
                    descripcion,
                    fotos: JSON.stringify(fotosArr),
                    tieneFlash: tieneFlash ? 'true' : 'false',
                    activo: 'true'
                };

                showToast("Guardando producto en TresaMarket...");
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams(prod) });
                
                state.editingProduct = null;
                showToast("¡Producto publicado con éxito!");
                e.target.reset();
                await fetchData(true);
            } catch (err) {
                console.error("Error al publicar:", err);
                showToast("Error al publicar producto", "error");
            } finally {
                if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerText = "Publicar Producto"; }
            }
        }

        function startEditProduct(id) {
            state.editingProduct = state.productos.find(p => p.id === id);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProduct(id) {
            if(confirm("¿Estás seguro de borrar este producto?")) {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams({ action: 'borrar_producto', id }) });
                showToast("Producto eliminado");
                setTimeout(() => fetchData(true), 1500);
            }
        }

        function openProductModal(id) {
            state.selectedProductModal = id;
            state.checkoutData = { cant: 1, cliente: '', direccion: '', nota: '', flash: false };
            render();
        }

        async function enviarPedido(productId) {
            const p = state.productos.find(x => x.id === productId);
            const vendorUser = state.usuarios.find(u => u.email === p.vendorEmail) || { wsp: CENTRAL_WSP };
            let isFlashProd = p.tieneFlash === true || p.tieneFlash === 'true' || p.tieneFlash === 'TRUE';
            
            const subtotal = p.precio * state.checkoutData.cant;
            const envioComprador = isFlashProd ? 2000 : 0;
            const total = subtotal + envioComprador;
            
            let msg = `Hola ${p.vendorLocal || p.vendorNombre || 'Vendedor'}! Nuevo pedido desde TresaMarket:\n📦 ${p.nombre} x${state.checkoutData.cant} - $${subtotal.toLocaleString('es-AR')}\n👤 Cliente: ${state.checkoutData.cliente}\n📍 Dir: ${state.checkoutData.direccion}`;
            if (isFlashProd) {
                msg += `\n🚚 Envío FLASH express: + $2.000`;
            }
            msg += `\nTotal a abonar: $${total.toLocaleString('es-AR')}`;
            
            const order = {
                action: 'crear_pedido',
                id: 'ord_' + Date.now(),
                vendorEmail: p.vendorEmail,
                tiendaNombre: p.vendorLocal || p.vendorNombre || 'Local',
                productoId: p.id,
                productoNombre: p.nombre,
                cantidad: state.checkoutData.cant,
                subtotal,
                totalCliente: total,
                cliente: state.checkoutData.cliente,
                direccion: state.checkoutData.direccion,
                flash: isFlashProd ? 'true' : 'false',
                fecha: new Date().toISOString()
            };
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams(order) });
            window.open(`https://wa.me/549${vendorUser.wsp || CENTRAL_WSP}?text=${encodeURIComponent(msg)}`, '_blank');
            state.selectedProductModal = null;
            showToast("¡Pedido enviado por WhatsApp!");
            setTimeout(() => fetchData(true), 1500);
        }

        function renderModals() {
            let html = '';
            if (state.authModalOpen) {
                html += `
                    <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 relative modal-box">
                            <button onclick="state.authModalOpen=false;render();" class="absolute top-4 right-4 font-bold">✕</button>
                            <div class="flex border-b">
                                <button onclick="state.authTab='login';render();" class="flex-1 pb-2 text-sm font-bold border-b-2 ${state.authTab==='login'?'border-teal-700 text-teal-800':'border-transparent'}">Ingresar</button>
                                <button onclick="state.authTab='register';render();" class="flex-1 pb-2 text-sm font-bold border-b-2 ${state.authTab==='register'?'border-teal-700 text-teal-800':'border-transparent'}">Registrarse</button>
                            </div>
                            ${state.authTab==='login' ? `
                                <form onsubmit="handleLogin(event)" class="space-y-3">
                                    <div><label class="text-xs font-semibold">Email</label><input type="email" name="email" required class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                                    <div><label class="text-xs font-semibold">Contraseña</label><input type="password" name="password" required class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                                    <button type="submit" class="w-full h-11 bg-teal-700 text-white font-bold rounded-2xl text-sm">Entrar</button>
                                </form>
                            ` : `
                                <form onsubmit="handleRegister(event)" class="space-y-3">
                                    <div><label class="text-xs font-semibold">Nombre Completo</label><input type="text" name="nombre" required class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                                    <div><label class="text-xs font-semibold">Nombre de tu Local / Emprendimiento</label><input type="text" name="nombreLocal" required placeholder="Ej: Aura Beauty" class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                                    <div><label class="text-xs font-semibold">Email</label><input type="email" name="email" required class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                                    <div><label class="text-xs font-semibold">WhatsApp (ej: 2983445566)</label><input type="text" name="wsp" required class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                                    <div><label class="text-xs font-semibold">Contraseña</label><input type="password" name="password" required class="w-full bg-slate-50 border rounded-2xl px-4 py-2.5 text-sm mt-1"></div>
                                    <button type="submit" class="w-full h-11 bg-teal-700 text-white font-bold rounded-2xl text-sm">Registrarse</button>
                                </form>
                            `}
                        </div>
                    </div>
                `;
            }

            if (state.selectedProductModal) {
                const p = state.productos.find(prod => prod.id === state.selectedProductModal);
                if (p) {
                    let fotos = ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'];
                    try { let parsed = typeof p.fotos === 'string' ? JSON.parse(p.fotos) : p.fotos; if(parsed.length > 0) fotos = parsed; } catch(e){}
                    const cId = 'modal_carousel';
                    let isFlashProd = p.tieneFlash === true || p.tieneFlash === 'true' || p.tieneFlash === 'TRUE';
                    const subtotal = p.precio * state.checkoutData.cant;
                    const envioComprador = isFlashProd ? 2000 : 0;
                    const total = subtotal + envioComprador;

                    html += `
                        <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4 relative modal-box">
                                <button onclick="state.selectedProductModal=null;render();" class="absolute top-4 right-4 bg-slate-100 w-8 h-8 rounded-full font-bold z-20">✕</button>
                                
                                <div class="relative h-56 rounded-2xl overflow-hidden bg-slate-100 carousel-container" data-carousel-id="${cId}">
                                    ${fotos.map((f, i) => `<div class="carousel-slide w-full h-full" style="display: ${i===0?'block':'none'}"><img src="${f}" class="w-full h-full object-cover"></div>`).join('')}
                                    ${fotos.length > 1 ? `
                                        <button onclick="prevSlide('${cId}')" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-7 h-7 rounded-full flex items-center justify-center">‹</button>
                                        <button onclick="nextSlide('${cId}')" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-7 h-7 rounded-full flex items-center justify-center">›</button>
                                        <div class="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5 z-10">
                                            ${fotos.map((_, i) => `<span class="carousel-dot w-2 h-2 rounded-full ${i===0?'bg-white':'bg-white/50'}"></span>`).join('')}
                                        </div>
                                    ` : ''}
                                    ${isFlashProd ? `<span class="absolute top-3 left-3 bg-amber-500 text-white text-xs px-2.5 py-1 rounded-xl font-extrabold shadow">⚡ FLASH</span>` : ''}
                                </div>

                                <div>
                                    <span class="text-xs font-bold text-teal-700">Vendido por: ${p.vendorLocal || p.vendorNombre || 'Local'}</span>
                                    <h2 class="text-xl font-extrabold text-slate-900 mt-0.5">${p.nombre}</h2>
                                    <p class="text-2xl font-black text-slate-900 mt-1">$${Number(p.precio).toLocaleString('es-AR')}</p>
                                    <p class="text-xs text-slate-600 mt-2">${p.descripcion || ''}</p>
                                </div>

                                <div class="bg-slate-50 border rounded-2xl p-4 space-y-3">
                                    <h3 class="text-xs font-bold uppercase text-slate-700">🛍️ Pedido por WhatsApp</h3>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div><label class="text-[11px] font-semibold">Cant</label><input type="number" min="1" value="${state.checkoutData.cant}" onchange="state.checkoutData.cant=Number(this.value);render();" class="w-full bg-white border rounded-xl px-3 py-2 text-sm mt-1"></div>
                                        <div><label class="text-[11px] font-semibold">Tu Nombre</label><input type="text" value="${state.checkoutData.cliente}" oninput="state.checkoutData.cliente=this.value" placeholder="Ej: Juan" class="w-full bg-white border rounded-xl px-3 py-2 text-sm mt-1"></div>
                                    </div>
                                    <div><label class="text-[11px] font-semibold">Dirección</label><input type="text" value="${state.checkoutData.direccion}" oninput="state.checkoutData.direccion=this.value" placeholder="San Martín 450" class="w-full bg-white border rounded-xl px-3 py-2 text-sm mt-1"></div>
                                    
                                    ${isFlashProd ? `
                                        <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-[11px] text-amber-900">
                                            ⚡ Este producto cuenta con envío <b>FLASH</b> (+ $2.000 de envío sumado al total).
                                        </div>
                                    ` : ''}

                                    <div class="pt-2 border-t flex justify-between items-center text-sm font-bold"><span>Total:</span><span class="text-lg text-teal-800">$${total.toLocaleString('es-AR')}</span></div>
                                    <button onclick="enviarPedido('${p.id}')" class="w-full h-12 bg-teal-700 text-white font-extrabold rounded-2xl text-sm">💬 Enviar Pedido por WhatsApp</button>
                                </div>

                                ${p.vendorLocal ? `<div class="text-center pt-2"><a href="#local/${encodeURIComponent(p.vendorLocal)}" onclick="state.selectedProductModal=null;" class="text-xs text-teal-700 font-bold underline">Ver catálogo completo de ${p.vendorLocal}</a></div>` : ''}
                            </div>
                        </div>
                    `;
                }
            }
            return html;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const newUser = {
                id: 'usr_' + Date.now(),
                email: fd.get('email').toLowerCase().trim(),
                pass: fd.get('password'),
                nombre: fd.get('nombre'),
                nombreLocal: fd.get('nombreLocal').trim(),
                wsp: fd.get('wsp'),
                fecha: new Date().toISOString()
            };
            state.session = { email: newUser.email, nombre: newUser.nombre };
            localStorage.setItem('tresamarket_session', JSON.stringify(state.session));
            state.authModalOpen = false;

            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams({ action: 'registro', ...newUser }) });
            showToast("Registro exitoso ✓");
            window.location.hash = '#mi-panel';
            setTimeout(() => fetchData(true), 1500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const email = fd.get('email').toLowerCase().trim();
            const pass = fd.get('password');
            let u = state.usuarios.find(x => x.email === email && (x.pass === pass || x.password === pass));
            if (u) {
                state.session = { email: u.email, nombre: u.nombre };
                localStorage.setItem('tresamarket_session', JSON.stringify(state.session));
                state.authModalOpen = false;
                showToast("Sesión iniciada");
                window.location.hash = '#mi-panel';
                render();
            } else {
                showToast("Datos incorrectos", "error");
            }
        }

        function logout() {
            state.session = null;
            localStorage.removeItem('tresamarket_session');
            window.location.hash = '';
            showToast("Sesión cerrada");
        }

        function openAuthModal(tab) { state.authModalOpen = true; state.authTab = tab; render(); }

        window.addEventListener('DOMContentLoaded', () => {
            fetchData(true);
            handleRoute();
        });
    </script>
</body>
</html>

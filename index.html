<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turismo3a | Marketplace Local</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f766e',
                        secondary: '#e2e8f0',
                        dark: '#1e293b',
                        bglight: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        *, *:before, *:after {
            box-sizing: inherit;
            max-width: 100%;
        }
        .modal-box {
            width: 95%;
            max-width: 450px;
            margin: auto;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (max-width: 768px) {
            .ml-responsive-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 8px !important;
            }
        }
        @media (min-width: 769px) and (max-width: 1024px) {
            .ml-responsive-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
                gap: 12px !important;
            }
        }
        @media (min-width: 1025px) {
            .ml-responsive-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
                gap: 16px !important;
            }
        }

        .ml-product-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 150ms ease-in-out;
            border: 1px solid #f1f5f9;
        }
        .ml-product-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
        .ml-product-img-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
        }
        .ml-product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ml-product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .ml-product-title {
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .ml-product-price {
            font-size: 16px;
            font-weight: 700;
            color: #0f766e;
        }

        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .skeleton {
            background: #e2e8f0;
            animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-bglight text-dark min-h-screen flex flex-col transition-all duration-150">

    <div id="sync-bar" class="bg-slate-800 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50">
        <span id="sync-status-text">○ Cargando datos desde Sheets...</span>
        <button onclick="manualSync()" class="underline text-teal-300 hover:text-white">Actualizar</button>
    </div>

    <div id="app" class="flex-1 flex flex-col w-full transition-all duration-150">
        <div class="max-w-6xl mx-auto px-4 py-6 w-full">
            <div class="h-44 bg-slate-200 rounded-3xl skeleton mb-6"></div>
            <div class="flex gap-2 mb-6 overflow-x-auto no-scrollbar">
                <div class="w-20 h-10 rounded-xl skeleton flex-shrink-0"></div>
                <div class="w-24 h-10 rounded-xl skeleton flex-shrink-0"></div>
                <div class="w-20 h-10 rounded-xl skeleton flex-shrink-0"></div>
            </div>
            <div class="grid ml-responsive-grid gap-3">
                ${[1,2,3,4,5,6].map(() => `
                    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-100 space-y-3">
                        <div class="w-full aspect-square skeleton rounded-lg"></div>
                        <div class="h-4 skeleton rounded w-3/4"></div>
                        <div class="h-5 skeleton rounded w-1/2"></div>
                    </div>
                `).join('')}
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6sUbdfJ23AOKNC0hwfGMWTeZ-9Ck4LpgeT4aEGmwm5SA3GVqtj-PGFBjx7PQh7ONWuA/exec";
        const CENTRAL_WSP = "5492983389710";

        let cachedData = null;
        try {
            cachedData = JSON.parse(localStorage.getItem('turismo3a_cache') || 'null');
        } catch(e){}

        let sessionObj = JSON.parse(localStorage.getItem('turismo3a_session') || 'null');

        let state = {
            productos: cachedData ? cachedData.productos : [],
            pedidos: cachedData ? cachedData.pedidos : [],
            usuarios: cachedData ? cachedData.usuarios : [],
            session: sessionObj,
            isOnline: true,
            activeCategory: 'Todos',
            searchQuery: '',
            authTab: 'login',
            authModalOpen: false,
            selectedProductModal: null,
            checkoutData: { cant: 1, cliente: '', direccion: '', nota: '', flash: false },
            currentView: 'catalogo',
            activeVendorEmail: null,
            isLoading: !cachedData
        };

        window.allData = cachedData || { productos: [], pedidos: [], usuarios: [] };

        async function uploadImageToDrive(file) {
            if (!file) return '';
            if (typeof file === 'string') return file;
            try {
                const base64Data = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => resolve('');
                });
                if (!base64Data) return '';
                const base64Clean = base64Data.includes(',') ? base64Data.split(',')[1] : base64Data;

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'uploadImage',
                        name: file.name || 'foto.jpg',
                        base64: base64Clean,
                        type: file.type || 'image/jpeg'
                    })
                });
                const data = await response.json();
                if (data && data.status === 'success' && data.url) return data.url;
            } catch (err) {
                console.error("Error subiendo imagen:", err);
            }
            return '';
        }

        async function uploadMultipleImages(fileList, maxCount = 4) {
            let files = Array.from(fileList).slice(0, maxCount);
            let urls = [];
            for (let f of files) {
                let url = await uploadImageToDrive(f);
                if (url) urls.push(url);
            }
            return urls;
        }

        const CATEGORIES = ['Todos', 'Alimentos', 'Servicios', 'Indumentaria', 'Hogar y Deco', 'Belleza', 'Oficios', 'Tecnología', 'Vehículos'];

        function fetchData(force = false) {
            let url = SCRIPT_URL + '?_=' + Date.now() + '&r=' + Math.random();
            return fetch(url, { cache: 'no-store' }).then(r => r.json()).then(data => {
                window.allData = data;
                localStorage.setItem('turismo3a_cache', JSON.stringify(data));
                state.productos = data.productos || [];
                state.pedidos = data.pedidos || [];
                state.usuarios = data.usuarios || [];
                state.isOnline = true;
                state.isLoading = false;
                updateSyncBar(true);
                render();
                return data;
            }).catch(err => {
                console.error("Error fetching from Sheets:", err);
                state.isOnline = false;
                state.isLoading = false;
                updateSyncBar(false);
                return null;
            });
        }

        function updateSyncBar(online) {
            const bar = document.getElementById('sync-bar');
            const txt = document.getElementById('sync-status-text');
            if (!bar || !txt) return;
            if (online) {
                bar.className = "bg-teal-800 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50";
                txt.innerHTML = "● Conectado con Sheets";
            } else {
                bar.className = "bg-amber-700 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50";
                txt.innerHTML = "○ Sin conexión (Modo Caché)";
            }
        }

        function manualSync() {
            showToast("Sincronizando...");
            fetchData(true);
        }

        let carouselIntervals = {};
        function startCarousels() {
            Object.values(carouselIntervals).forEach(clearInterval);
            carouselIntervals = {};

            document.querySelectorAll('.carousel-container').forEach(container => {
                const id = container.dataset.carouselId;
                const slides = container.querySelectorAll('.carousel-slide');
                const dots = container.querySelectorAll('.carousel-dot');
                if (slides.length <= 1) return;

                let currentIndex = 0;
                const showSlide = (idx) => {
                    slides.forEach((s, i) => { s.style.display = (i === idx) ? 'block' : 'none'; });
                    dots.forEach((d, i) => {
                        d.className = (i === idx) 
                            ? 'carousel-dot w-2 h-2 rounded-full bg-white scale-110 transition-all' 
                            : 'carousel-dot w-2 h-2 rounded-full bg-white/50 transition-all';
                    });
                };

                showSlide(0);
                carouselIntervals[id] = setInterval(() => {
                    currentIndex = (currentIndex + 1) % slides.length;
                    showSlide(currentIndex);
                }, 3500);
            });
        }

        function nextSlide(id) {
            const container = document.querySelector(`[data-carousel-id="${id}"]`);
            if(!container) return;
            const slides = container.querySelectorAll('.carousel-slide');
            const dots = container.querySelectorAll('.carousel-dot');
            let current = Array.from(slides).findIndex(s => s.style.display === 'block');
            if(current === -1) current = 0;
            let next = (current + 1) % slides.length;
            slides.forEach((s, i) => { s.style.display = (i === next) ? 'block' : 'none'; });
            dots.forEach((d, i) => { d.className = (i === next) ? 'carousel-dot w-2 h-2 rounded-full bg-white scale-110 transition-all' : 'carousel-dot w-2 h-2 rounded-full bg-white/50 transition-all'; });
        }

        function prevSlide(id) {
            const container = document.querySelector(`[data-carousel-id="${id}"]`);
            if(!container) return;
            const slides = container.querySelectorAll('.carousel-slide');
            const dots = container.querySelectorAll('.carousel-dot');
            let current = Array.from(slides).findIndex(s => s.style.display === 'block');
            if(current === -1) current = 0;
            let prev = (current - 1 + slides.length) % slides.length;
            slides.forEach((s, i) => { s.style.display = (i === prev) ? 'block' : 'none'; });
            dots.forEach((d, i) => { d.className = (i === prev) ? 'carousel-dot w-2 h-2 rounded-full bg-white scale-110 transition-all' : 'carousel-dot w-2 h-2 rounded-full bg-white/50 transition-all'; });
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const t = document.createElement('div');
            t.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm transition-all transform translate-y-2 opacity-0 ${type === 'error' ? 'bg-rose-600' : 'bg-teal-700'}`;
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => { t.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                t.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => t.remove(), 300);
            }, 3000);
        }

        function handleRoute() {
            const hash = window.location.hash;
            if (hash.startsWith('#vendedor/')) {
                state.currentView = 'catalogo-vendedor';
                state.activeVendorEmail = decodeURIComponent(hash.replace('#vendedor/', ''));
            } else if (hash.startsWith('#mi-panel')) {
                state.currentView = 'mi-panel';
            } else if (hash.startsWith('#mis-productos')) {
                state.currentView = 'mis-productos';
            } else {
                state.currentView = 'catalogo';
                state.activeVendorEmail = null;
            }
            render();
        }

        window.addEventListener('hashchange', handleRoute);

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            let html = '';
            if (state.currentView === 'mi-panel') {
                html = renderMiPanel();
            } else if (state.currentView === 'mis-productos') {
                html = renderMisProductos();
            } else if (state.currentView === 'catalogo-vendedor') {
                html = renderCatalogoVendedorView();
            } else {
                html = renderGeneralCatalogView();
            }

            html += renderModals();
            app.innerHTML = html;
            startCarousels();
        }

        function renderGeneralCatalogView() {
            let filtered = state.productos.filter(p => p.activo !== false && p.activo !== 'false');
            if (state.activeCategory !== 'Todos') {
                filtered = filtered.filter(p => p.categoria === state.activeCategory);
            }
            if (state.searchQuery.trim() !== '') {
                const q = state.searchQuery.toLowerCase();
                filtered = filtered.filter(p => p.nombre.toLowerCase().includes(q) || (p.descripcion && p.descripcion.toLowerCase().includes(q)));
            }

            return `
                <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
                    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
                        <a href="#" class="text-xl font-bold text-teal-800 flex items-center gap-2">
                            🛒 Turismo3a Market
                        </a>
                        <div class="w-full sm:w-96 relative">
                            <input type="text" placeholder="Buscá productos, servicios..." value="${state.searchQuery}" oninput="state.searchQuery = this.value; render();"
                                class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-700">
                        </div>
                        <div>
                            ${state.session ? 
                                `<a href="#mi-panel" class="bg-teal-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold">Mi Panel</a>` :
                                `<button onclick="openAuthModal('login')" class="bg-teal-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold">Ingresar / Registrarse</button>`
                            }
                        </div>
                    </div>
                    <div class="max-w-6xl mx-auto px-4 py-2 overflow-x-auto no-scrollbar flex gap-2 border-t border-slate-100">
                        ${CATEGORIES.map(cat => `
                            <button onclick="state.activeCategory = '${cat}'; render();" 
                                class="whitespace-nowrap px-4 py-1.5 rounded-xl text-xs font-semibold transition ${state.activeCategory === cat ? 'bg-teal-700 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>
                </header>

                <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-4">
                    <div class="bg-gradient-to-r from-teal-800 to-teal-900 rounded-3xl p-6 text-white shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <span class="bg-teal-700 text-teal-200 text-xs px-3 py-1 rounded-full font-semibold">📍 Turismo3a</span>
                            <h1 class="text-2xl md:text-3xl font-extrabold mt-2">Marketplace de Emprendedores Locales</h1>
                            <p class="text-teal-100 text-xs md:text-sm mt-1">Comprá directo a los comercios de la zona por WhatsApp de forma rápida y segura.</p>
                        </div>
                    </div>

                    <h2 class="text-lg font-bold text-slate-800">Catálogo General (${filtered.length})</h2>

                    ${filtered.length === 0 ? `
                        <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 p-6">
                            <p class="text-slate-500 text-sm">No se encontraron productos disponibles.</p>
                        </div>
                    ` : `
                        <div class="grid ml-responsive-grid">
                            ${filtered.map(p => renderProductCard(p)).join('')}
                        </div>
                    `}
                </main>
            `;
        }

        function renderProductCard(p) {
            let fotos = ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'];
            try {
                if (p.fotos) {
                    let parsed = typeof p.fotos === 'string' ? JSON.parse(p.fotos) : p.fotos;
                    if (Array.isArray(parsed) && parsed.length > 0) fotos = parsed;
                }
            } catch(e) {}
            return `
                <div onclick="openProductModal('${p.id}')" class="ml-product-card">
                    <div class="ml-product-img-container">
                        <img src="${fotos[0]}" loading="lazy" class="ml-product-img">
                        <span class="absolute top-2 left-2 bg-teal-900/80 text-white text-[10px] px-2 py-0.5 rounded-lg font-medium">${p.categoria}</span>
                    </div>
                    <div class="ml-product-info">
                        <div>
                            <span class="text-[11px] text-teal-700 font-semibold block truncate">${p.vendorNombre || 'Vendedor'}</span>
                            <h3 class="ml-product-title mt-0.5">${p.nombre}</h3>
                        </div>
                        <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between">
                            <span class="ml-product-price">$${Number(p.precio).toLocaleString('es-AR')}</span>
                            <span class="text-xs bg-teal-50 text-teal-800 px-2.5 py-1 rounded-xl font-semibold">Ver</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCatalogoVendedorView() {
            let email = state.activeVendorEmail;
            let prods = state.productos.filter(p => p.vendorEmail === email && p.activo !== false && p.activo !== 'false');
            let vendedorNombre = prods.length > 0 ? prods[0].vendorNombre : 'Vendedor';
            let vendedorUser = state.usuarios.find(u => u.email === email) || {};

            return `
                <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
                    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                        <a href="#" class="text-teal-800 text-xs font-bold">← Volver al market</a>
                        <span class="text-sm font-bold text-slate-700">${vendedorNombre}</span>
                        <a href="https://wa.me/549${vendedorUser.wsp || CENTRAL_WSP}" target="_blank" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded-xl font-bold">WhatsApp</a>
                    </div>
                </header>
                <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex items-center gap-4">
                        <div class="w-16 h-16 rounded-2xl bg-teal-700 text-white flex items-center justify-center font-extrabold text-2xl shadow-inner">
                            ${vendedorNombre.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h1 class="text-xl font-extrabold text-slate-900">${vendedorNombre}</h1>
                            <p class="text-xs text-teal-800 font-semibold mt-1">📞 +54 9 ${vendedorUser.wsp || 'Consultar'}</p>
                        </div>
                    </div>
                    <h2 class="text-lg font-bold text-slate-900">Catálogo de Productos (${prods.length})</h2>
                    <div class="grid ml-responsive-grid">
                        ${prods.map(p => renderProductCard(p)).join('')}
                    </div>
                </main>
            `;
        }

        function renderMiPanel() {
            if (!state.session) {
                return `
                    <div class="max-w-md mx-auto px-4 py-20 text-center space-y-4">
                        <span class="text-5xl block">🔒</span>
                        <h2 class="text-xl font-bold text-slate-800">Panel del Vendedor</h2>
                        <p class="text-slate-500 text-sm">Iniciá sesión para ver tus productos y pedidos.</p>
                        <button onclick="openAuthModal('login')" class="bg-teal-700 text-white px-5 py-2.5 rounded-xl font-medium">Ingresar</button>
                    </div>
                `;
            }
            const myOrders = state.pedidos.filter(o => o.vendorEmail === state.session.email);

            return `
                <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
                    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                        <a href="#" class="text-teal-800 text-xs font-bold">← Volver al Market</a>
                        <button onclick="logout()" class="bg-rose-50 text-rose-700 text-xs px-3 py-2 rounded-xl font-bold">Cerrar Sesión</button>
                    </div>
                </header>
                <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 flex justify-between items-center">
                        <div>
                            <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">● Vendedor Activo</span>
                            <h1 class="text-2xl font-extrabold text-slate-900 mt-2">${state.session.nombre}</h1>
                            <p class="text-xs text-slate-500 mt-0.5">${state.session.email}</p>
                        </div>
                        <a href="#mis-productos" class="bg-teal-700 hover:bg-teal-800 text-white text-xs px-5 py-3 rounded-2xl font-bold shadow transition">📦 Administrar Productos</a>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <h3 class="text-base font-bold text-slate-900">📋 Pedidos Recibidos (${myOrders.length})</h3>
                        ${myOrders.length === 0 ? `
                            <p class="text-slate-500 text-sm text-center py-6">Aún no recibiste pedidos.</p>
                        ` : `
                            <div class="space-y-3">
                                ${myOrders.map(o => `
                                    <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50 space-y-1 text-xs">
                                        <div class="font-bold text-slate-800 text-sm">📦 ${o.productoNombre} x${o.cantidad} - $${Number(o.totalCliente || o.subtotal).toLocaleString('es-AR')}</div>
                                        <div><b>Cliente:</b> ${o.cliente} | <b>Dirección:</b> ${o.direccion}</div>
                                        ${o.nota ? `<div><b>Nota:</b> ${o.nota}</div>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </main>
            `;
        }

        function renderMisProductos() {
            if (!state.session) { window.location.hash = ''; return ''; }
            const myProds = state.productos.filter(p => p.vendorEmail === state.session.email);

            return `
                <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
                    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
                        <a href="#mi-panel" class="text-teal-800 text-xs font-bold">← Volver al Panel</a>
                        <button onclick="logout()" class="bg-rose-50 text-rose-700 text-xs px-3 py-2 rounded-xl font-bold">Cerrar Sesión</button>
                    </div>
                </header>

                <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <h2 class="text-lg font-bold text-slate-900">➕ Agregar Nuevo Producto (Hasta 4 fotos)</h2>
                        <form onsubmit="handleCreateProduct(event)" class="space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs font-semibold text-slate-700">Nombre del Producto</label>
                                    <input type="text" name="nombre" required placeholder="Ej: Remera Estampada" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1">
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-slate-700">Precio ARS ($)</label>
                                    <input type="number" name="precio" required placeholder="Ej: 8500" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs font-semibold text-slate-700">Categoría</label>
                                    <select name="categoria" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1">
                                        ${CATEGORIES.filter(c => c !== 'Todos').map(c => `<option value="${c}">${c}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-slate-700">Fotos (Hasta 4)</label>
                                    <input type="file" name="fotos" accept="image/*" multiple id="prod-fotos-input" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2 text-xs mt-1">
                                </div>
                            </div>

                            <div>
                                <label class="text-xs font-semibold text-slate-700">Descripción</label>
                                <textarea name="descripcion" rows="2" placeholder="Detalles, talle, materiales..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1"></textarea>
                            </div>

                            <button type="submit" class="w-full h-12 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-2xl shadow transition text-sm">
                                Guardar y Publicar Producto
                            </button>
                        </form>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <h2 class="text-lg font-bold text-slate-900">📦 Mis Productos (${myProds.length})</h2>
                        ${myProds.length === 0 ? `
                            <p class="text-slate-500 text-sm text-center py-6">Todavía no cargaste ningún producto.</p>
                        ` : `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${myProds.map(p => {
                                    let f = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100';
                                    try {
                                        let parsed = typeof p.fotos === 'string' ? JSON.parse(p.fotos) : p.fotos;
                                        if (Array.isArray(parsed) && parsed.length > 0) f = parsed[0];
                                    } catch(e) {}
                                    return `
                                        <div class="border border-slate-200 rounded-2xl p-3 flex items-center justify-between gap-3 bg-slate-50">
                                            <div class="flex items-center gap-3">
                                                <img src="${f}" class="w-14 h-14 rounded-xl object-cover">
                                                <div>
                                                    <h4 class="text-sm font-bold text-slate-800 line-clamp-1">${p.nombre}</h4>
                                                    <span class="text-xs font-extrabold text-teal-800">$${Number(p.precio).toLocaleString('es-AR')}</span>
                                                </div>
                                            </div>
                                            <button onclick="deleteProduct('${p.id}')" class="text-xs bg-rose-50 text-rose-700 hover:bg-rose-100 px-3 py-2 rounded-xl font-bold">Borrar</button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>
                </main>
            `;
        }

        function renderModals() {
            let html = '';

            if (state.authModalOpen) {
                html += `
                    <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 relative modal-box">
                            <button onclick="state.authModalOpen=false;render();" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 font-bold">✕</button>
                            <div class="flex border-b border-slate-200">
                                <button onclick="state.authTab='login';render();" class="flex-1 pb-3 text-sm font-bold border-b-2 transition ${state.authTab==='login'?'border-teal-700 text-teal-800':'border-transparent text-slate-400'}">Ingresar</button>
                                <button onclick="state.authTab='register';render();" class="flex-1 pb-3 text-sm font-bold border-b-2 transition ${state.authTab==='register'?'border-teal-700 text-teal-800':'border-transparent text-slate-400'}">Registrarse</button>
                            </div>

                            ${state.authTab === 'login' ? `
                                <form onsubmit="handleLogin(event)" class="space-y-3">
                                    <div>
                                        <label class="text-xs font-semibold text-slate-700">Email</label>
                                        <input type="email" name="email" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-700">Contraseña</label>
                                        <input type="password" name="password" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1 focus:outline-none">
                                    </div>
                                    <button type="submit" class="w-full h-12 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-2xl shadow transition text-sm">Iniciar Sesión</button>
                                </form>
                            ` : `
                                <form onsubmit="handleRegister(event)" class="space-y-3">
                                    <div>
                                        <label class="text-xs font-semibold text-slate-700">Nombre Completo</label>
                                        <input type="text" name="nombre" required placeholder="Ej: María Gómez" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-700">Email</label>
                                        <input type="email" name="email" required placeholder="tu@email.com" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-700">WhatsApp (ej: 2983445566)</label>
                                        <input type="text" name="wsp" required placeholder="2983445566" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-700">Contraseña</label>
                                        <input type="password" name="password" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm mt-1 focus:outline-none">
                                    </div>
                                    <button type="submit" class="w-full h-12 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-2xl shadow transition text-sm">Registrarse</button>
                                </form>
                            `}
                        </div>
                    </div>
                `;
            }

            if (state.selectedProductModal) {
                const p = state.productos.find(prod => prod.id === state.selectedProductModal);
                if (p) {
                    let fotos = ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'];
                    try {
                        let parsed = typeof p.fotos === 'string' ? JSON.parse(p.fotos) : p.fotos;
                        if (Array.isArray(parsed) && parsed.length > 0) fotos = parsed;
                    } catch(e) {}
                    const cId = 'modal_carousel';
                    const subtotal = p.precio * state.checkoutData.cant;
                    const total = subtotal + (state.checkoutData.flash ? 2000 : 0);

                    html += `
                        <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4 relative modal-box">
                                <button onclick="state.selectedProductModal=null;render();" class="absolute top-4 right-4 bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center text-slate-600 font-bold z-20">✕</button>

                                <div class="relative h-64 rounded-2xl overflow-hidden bg-slate-100 carousel-container" data-carousel-id="${cId}">
                                    ${fotos.map((f, i) => `
                                        <div class="carousel-slide w-full h-full" style="display: ${i===0?'block':'none'}">
                                            <img src="${f}" class="w-full h-full object-cover">
                                        </div>
                                    `).join('')}
                                    ${fotos.length > 1 ? `
                                        <button onclick="prevSlide('${cId}')" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">‹</button>
                                        <button onclick="nextSlide('${cId}')" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">›</button>
                                        <div class="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5 z-10">
                                            ${fotos.map((_, i) => `<span class="carousel-dot w-2 h-2 rounded-full ${i===0?'bg-white':'bg-white/50'}"></span>`).join('')}
                                        </div>
                                    ` : ''}
                                    <span class="absolute top-3 left-3 bg-teal-900/80 text-white text-xs px-2.5 py-1 rounded-xl font-medium">${p.categoria}</span>
                                </div>

                                <div>
                                    <span class="text-xs font-bold text-teal-700">${p.vendorNombre || 'Vendedor'}</span>
                                    <h2 class="text-xl font-extrabold text-slate-900 mt-0.5">${p.nombre}</h2>
                                    <p class="text-2xl font-black text-slate-900 mt-1">$${Number(p.precio).toLocaleString('es-AR')}</p>
                                    <p class="text-xs text-slate-600 mt-2">${p.descripcion || 'Sin descripción adicional.'}</p>
                                </div>

                                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
                                    <h3 class="text-xs font-bold uppercase text-slate-700">🛍️ Hacer Pedido por WhatsApp</h3>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="text-[11px] font-semibold text-slate-600">Cantidad</label>
                                            <input type="number" min="1" value="${state.checkoutData.cant}" onchange="state.checkoutData.cant=Number(this.value);render();" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm mt-1 focus:outline-none">
                                        </div>
                                        <div>
                                            <label class="text-[11px] font-semibold text-slate-600">Tu Nombre</label>
                                            <input type="text" value="${state.checkoutData.cliente}" oninput="state.checkoutData.cliente=this.value" placeholder="Ej: Juan Pérez" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm mt-1 focus:outline-none">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-[11px] font-semibold text-slate-600">Dirección de Entrega</label>
                                        <input type="text" value="${state.checkoutData.direccion}" oninput="state.checkoutData.direccion=this.value" placeholder="Ej: San Martín 450" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm mt-1 focus:outline-none">
                                    </div>
                                    <div class="flex items-center gap-2 pt-1">
                                        <input type="checkbox" ${state.checkoutData.flash ? 'checked' : ''} onchange="state.checkoutData.flash=this.checked;render();" id="flash-modal-chk" class="w-4 h-4 text-teal-700 rounded border-slate-300">
                                        <label for="flash-modal-chk" class="text-[11px] text-amber-900 font-medium cursor-pointer">Envío FLASH express (+ $2.000)</label>
                                    </div>
                                    <div class="pt-2 border-t border-slate-200 flex justify-between items-center text-sm font-bold">
                                        <span>Total a pagar:</span>
                                        <span class="text-lg text-teal-800">$${total.toLocaleString('es-AR')}</span>
                                    </div>
                                    <button onclick="enviarPedido('${p.id}')" class="w-full h-12 bg-teal-700 hover:bg-teal-800 text-white font-extrabold rounded-2xl shadow transition text-sm flex items-center justify-center gap-2">
                                        💬 Enviar Pedido por WhatsApp
                                    </button>
                                </div>

                                ${p.vendorEmail ? `
                                    <div class="text-center pt-2">
                                        <a href="#vendedor/${encodeURIComponent(p.vendorEmail)}" onclick="state.selectedProductModal=null;" class="text-xs text-teal-700 font-bold underline hover:text-teal-900">
                                            Ver catálogo completo de ${p.vendorNombre || 'Vendedor'}
                                        </a>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            }

            return html;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const newUser = {
                id: 'usr_' + Date.now(),
                email: fd.get('email').toLowerCase().trim(),
                pass: fd.get('password'),
                nombre: fd.get('nombre'),
                wsp: fd.get('wsp'),
                fecha: new Date().toISOString()
            };
            state.session = { email: newUser.email, nombre: newUser.nombre };
            localStorage.setItem('turismo3a_session', JSON.stringify(state.session));
            state.authModalOpen = false;

            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ action: 'registro', ...newUser })
            });

            showToast("¡Cuenta creada con éxito!");
            window.location.hash = '#mis-productos';
            setTimeout(() => fetchData(true), 1500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const email = fd.get('email').toLowerCase().trim();
            const pass = fd.get('password');

            let found = state.usuarios.find(u => u.email === email && (u.pass === pass || u.password === pass));
            if (found) {
                state.session = { email: found.email, nombre: found.nombre };
                localStorage.setItem('turismo3a_session', JSON.stringify(state.session));
                state.authModalOpen = false;
                showToast("¡Sesión iniciada!");
                window.location.hash = '#mi-panel';
                render();
            } else {
                showToast("Datos incorrectos, verificá tu email y contraseña", "error");
            }
        }

        function logout() {
            state.session = null;
            localStorage.removeItem('turismo3a_session');
            window.location.hash = '';
            showToast("Sesión cerrada");
        }

        async function handleCreateProduct(e) {
            e.preventDefault();
            if (!state.session) return;
            try {
                const fd = new FormData(e.target);
                showToast("Subiendo fotos a Google Drive...");
                const filesInput = document.getElementById('prod-fotos-input');
                let fotosArr = [];
                if (filesInput && filesInput.files.length > 0) {
                    fotosArr = await uploadMultipleImages(filesInput.files, 4);
                }

                const newProd = {
                    action: 'crear_producto',
                    id: 'prod_' + Date.now(),
                    vendorEmail: state.session.email,
                    vendorNombre: state.session.nombre,
                    nombre: fd.get('nombre'),
                    precio: Number(fd.get('precio')),
                    categoria: fd.get('categoria'),
                    descripcion: fd.get('descripcion'),
                    fotos: JSON.stringify(fotosArr),
                    activo: 'true'
                };

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(newProd)
                });

                showToast("¡Producto guardado exitosamente!");
                e.target.reset();
                setTimeout(() => fetchData(true), 1500);
            } catch (err) {
                console.error(err);
                showToast("Error al guardar producto", "error");
            }
        }

        async function deleteProduct(id) {
            if (confirm("¿Estás seguro de eliminar este producto?")) {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ action: 'borrar_producto', id })
                });
                showToast("Producto eliminado");
                setTimeout(() => fetchData(true), 1500);
            }
        }

        function openProductModal(id) {
            state.selectedProductModal = id;
            state.checkoutData = { cant: 1, cliente: '', direccion: '', nota: '', flash: false };
            render();
        }

        async function enviarPedido(productId) {
            const p = state.productos.find(x => x.id === productId);
            const vendorUser = state.usuarios.find(u => u.email === p.vendorEmail) || { wsp: CENTRAL_WSP };
            const subtotal = p.precio * state.checkoutData.cant;
            const total = subtotal + (state.checkoutData.flash ? 2000 : 0);
            
            let msg = `Hola ${p.vendorNombre || 'Vendedor'}! Nuevo pedido desde Turismo3a:\n📦 ${p.nombre} x${state.checkoutData.cant} - $${subtotal.toLocaleString('es-AR')}\n👤 Cliente: ${state.checkoutData.cliente}\n📍 Dirección: ${state.checkoutData.direccion}`;
            if (state.checkoutData.flash) msg += `\n🚚 Envío FLASH (+ $2.000)`;
            msg += `\nTotal: $${total.toLocaleString('es-AR')}`;
            
            const order = {
                action: 'crear_pedido',
                id: 'ord_' + Date.now(),
                vendorEmail: p.vendorEmail,
                tiendaNombre: p.vendorNombre || 'Vendedor',
                productoId: p.id,
                productoNombre: p.nombre,
                cantidad: state.checkoutData.cant,
                subtotal,
                totalCliente: total,
                cliente: state.checkoutData.cliente,
                direccion: state.checkoutData.direccion,
                flash: state.checkoutData.flash ? 'true' : 'false',
                fecha: new Date().toISOString()
            };

            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(order)
            });

            window.open(`https://wa.me/549${vendorUser.wsp || CENTRAL_WSP}?text=${encodeURIComponent(msg)}`, '_blank');
            state.selectedProductModal = null;
            showToast("¡Pedido enviado por WhatsApp!");
            setTimeout(() => fetchData(true), 1500);
        }

        function openAuthModal(tab) {
            state.authModalOpen = true;
            state.authTab = tab;
            render();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (cachedData) {
                state.isLoading = false;
                render();
            }
            fetchData(true);
            handleRoute();
        });
    </script>
</body>
</html>

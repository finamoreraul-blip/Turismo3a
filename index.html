<body class="bg-bglight text-dark min-h-screen flex flex-col">

    <!-- SYNC STATUS BAR -->
    <div id="sync-bar" class="bg-slate-800 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50">
        <span id="sync-status-text">● Sincronizando con Sheets...</span>
        <button onclick="manualSync()" class="underline text-teal-300 hover:text-white">Actualizar</button>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Rendered dynamically -->
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // CONFIG & URL
        const SHEET_URL = "https://script.google.com/macros/s/AKfycbz6sUbdfJ23AOKNC0hwfGMWTeZ-9Ck4LpgeT4aEGmwm5SA3GVqtj-PGFBjx7PQh7ONWuA/exec";
        const CENTRAL_WSP = "5492983389710"; // Número central para pedidos Flash

        // APP STATE (LocalStorage first)
        let state = {
            users: JSON.parse(localStorage.getItem('ta_users')) || [],
            products: JSON.parse(localStorage.getItem('ta_products')) || [],
            orders: JSON.parse(localStorage.getItem('ta_orders')) || [],
            session: JSON.parse(localStorage.getItem('ta_session')) || null,
            pendingSync: JSON.parse(localStorage.getItem('ta_pending_sync')) || [],
            isOnline: true,
            activeCategory: 'Todos',
            searchQuery: '',
            authTab: 'login', // 'login' or 'register'
            selectedProductModal: null,
            selectedStoreModal: null,
            checkoutData: { cant: 1, cliente: '', direccion: '', nota: '', flash: false },
            editProductModal: null,
            adminAuthed: sessionStorage.getItem('ta_admin_auth') === 'true'
        };

        const CATEGORIES = ['Todos', 'Alimentos', 'Servicios', 'Indumentaria', 'Hogar y Deco', 'Belleza', 'Oficios', 'Tecnología', 'Vehículos'];
        const ZONES_TRES_ARROYOS = ['Centro', 'Barrio Norte', 'Barrio Sur', 'Villa Italia', 'Villa Primavera', 'Quintas', 'Planta Urbana General'];

        // --- COMPRESSION UTILS ---
        async function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                if (!file || typeof file === 'string') {
                    resolve(file);
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve(event.target.result);
                };
                reader.onerror = () => resolve(null);
            });
        }

        async function compressMultiple(fileList, maxCount = 4) {
            let files = Array.from(fileList).slice(0, maxCount);
            let promises = files.map(f => compressImage(f, 800, 0.7));
            return await Promise.all(promises);
        }

        // --- SYNC & LOCALSTORAGE ---
        function saveLocal() {
            localStorage.setItem('ta_users', JSON.stringify(state.users));
            localStorage.setItem('ta_products', JSON.stringify(state.products));
            localStorage.setItem('ta_orders', JSON.stringify(state.orders));
            localStorage.setItem('ta_session', JSON.stringify(state.session));
            localStorage.setItem('ta_pending_sync', JSON.stringify(state.pendingSync));
        }

        async function syncWithSheets(action, payload = {}) {
            saveLocal();
            try {
                const response = await fetch(SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, ...payload })
                });
                state.isOnline = true;
                updateSyncBar(true);
            } catch (err) {
                state.isOnline = false;
                updateSyncBar(false);
                state.pendingSync.push({ action, payload, time: Date.now() });
                localStorage.setItem('ta_pending_sync', JSON.stringify(state.pendingSync));
            }
        }

        async function fetchAllFromSheets() {
            try {
                const res = await fetch(`${SHEET_URL}?action=get_all`);
                const data = await res.json();
                if (data && data.users) {
                    if (data.users.length > 0) state.users = data.users;
                    if (data.products.length > 0) state.products = data.products;
                    if (data.orders.length > 0) state.orders = data.orders;
                    saveLocal();
                    state.isOnline = true;
                    updateSyncBar(true);
                    render();
                }
            } catch (e) {
                state.isOnline = false;
                updateSyncBar(false);
            }
        }

        function updateSyncBar(online) {
            const bar = document.getElementById('sync-bar');
            const txt = document.getElementById('sync-status-text');
            if (!bar || !txt) return;
            if (online) {
                bar.className = "bg-teal-800 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50";
                txt.innerText = "● Sincronizado con Sheets";
            } else {
                bar.className = "bg-amber-700 text-white text-xs py-1 px-4 text-center flex justify-between items-center z-50";
                txt.innerText = "○ Sin conexión - Guardado local (reintentando)";
            }
        }

        function manualSync() {
            showToast("Sincronizando datos...");
            fetchAllFromSheets();
            if (state.pendingSync.length > 0) {
                let item = state.pendingSync.shift();
                syncWithSheets(item.action, item.payload);
            }
        }

        // --- CAROUSEL AUTO-PLAY TIMERS ---
        let carouselIntervals = {};
        function startCarousels() {
            // Clear existing
            Object.values(carouselIntervals).forEach(clearInterval);
            carouselIntervals = {};

            // Find all carousels on page
            document.querySelectorAll('.carousel-container').forEach(container => {
                const id = container.dataset.carouselId;
                const slides = container.querySelectorAll('.carousel-slide');
                const dots = container.querySelectorAll('.carousel-dot');
                if (slides.length <= 1) return;

                let currentIndex = 0;
                const showSlide = (idx) => {
                    slides.forEach((s, i) => {
                        s.style.display = (i === idx) ? 'block' : 'none';
                    });
                    dots.forEach((d, i) => {
                        d.className = (i === idx) 
                            ? 'carousel-dot w-2 h-2 rounded-full bg-white scale-110 transition-all' 
                            : 'carousel-dot w-2 h-2 rounded-full bg-white/50 transition-all';
                    });
                };

                showSlide(0);

                carouselIntervals[id] = setInterval(() => {
                    currentIndex = (currentIndex + 1) % slides.length;
                    showSlide(currentIndex);
                }, 3000);

                // Expose next/prev globally
                window[`carousel_${id}_next`] = () => {
                    currentIndex = (currentIndex + 1) % slides.length;
                    showSlide(currentIndex);
                };
                window[`carousel_${id}_prev`] = () => {
                    currentIndex = (currentIndex - 1 + slides.length) % slides.length;
                    showSlide(currentIndex);
                };
            });
        }

        // --- TOAST NOTIFICATION ---
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const t = document.createElement('div');
            t.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-white font-medium text-sm transition-all transform translate-y-2 opacity-0 ${type === 'error' ? 'bg-rose-600' : 'bg-teal-700'}`;
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => { t.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                t.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => t.remove(), 300);
            }, 3000);
        }

        // --- ROUTER / HASH ROUTING ---
        function handleRoute() {
            const hash = window.location.hash;
            if (hash.startsWith('#admin') || window.location.pathname.includes('admin') || window.location.search.includes('admin')) {
                state.currentView = 'admin';
            } else if (hash.startsWith('#mi-tienda')) {
                state.currentView = 'mi-tienda';
            } else if (hash.startsWith('#t/')) {
                const slug = hash.replace('#t/', '');
                state.currentView = 'tienda-publica';
                state.activeSlug = slug;
            } else if (hash.startsWith('#c/')) {
                const slug = hash.replace('#c/', '');
                state.currentView = 'tienda-publica';
                state.activeSlug = slug;
            } else {
                state.currentView = 'catalogo';
            }
            render();
        }

        window.addEventListener('hashchange', handleRoute);

        // --- RENDER MASTER ---
        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            let html = '';
            if (state.currentView === 'admin') {
                html = renderAdminView();
            } else if (state.currentView === 'mi-tienda') {
                html = renderMiTiendaView();
            } else if (state.currentView === 'tienda-publica') {
                html = renderTiendaPublicaView();
            } else {
                html = renderGeneralCatalogView();
            }

            // Append Modals
            html += renderModals();

            app.innerHTML = html;
            startCarousels();
        }

        // ==========================================
        // 1. GENERAL CATALOG & HOME VIEW
        // ==========================================
        function renderGeneralCatalogView() {
            const activeUser = state.session ? state.users.find(u => u.email === state.session.email) : null;
            const primaryColor = activeUser && activeUser.catalogo && activeUser.catalogo.color ? activeUser.catalogo.color : '#0f766e';
            document.documentElement.style.setProperty('--primary-color', primaryColor);

            let filteredProducts = state.products.filter(p => p.activo !== false);
            if (state.activeCategory !== 'Todos') {
                filteredProducts = filteredProducts.filter(p => p.categoria === state.activeCategory);
            }
            if (state.searchQuery.trim() !== '') {
                const q = state.searchQuery.toLowerCase();
                filteredProducts = filteredProducts.filter(p => p.nombre.toLowerCase().includes(q) || p.descripcion.toLowerCase().includes(q));

            return `

                                    `<button onclick="openAuthModal('register')" class="bg-teal-700 text-white text-xs px-3 py-2 rounded-xl font-medium">¿Querés vender?</button>`
                                }
                            </div>
                        </div>

                        <!-- Search Bar -->
                        <div class="w-full sm:w-96 relative">
                            <input type="text" placeholder="Buscá productos, comidas, servicios..." value="${state.searchQuery}" oninput="state.searchQuery = this.value; render();"
                                class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal-700">
                        </div>

                        <div class="hidden sm:flex items-center gap-3">
                            ${state.session ? 
                                `<a href="#mi-tienda" class="bg-teal-700 text-white text-sm px-4 py-2.5 rounded-xl font-medium hover:bg-teal-800 transition">Mi Tienda</a>` :
                                `<button onclick="openAuthModal('register')" class="bg-teal-700 text-white text-sm px-4 py-2.5 rounded-xl font-medium hover:bg-teal-800 transition">¿Querés vender?</button>`
                            }
                        </div>
                    </div>

                    <!-- Categories Pills -->
                    <div class="max-w-6xl mx-auto px-4 py-2 overflow-x-auto no-scrollbar flex gap-2 border-t border-slate-100">
                        ${CATEGORIES.map(cat => `
                            <button onclick="state.activeCategory = '${cat}'; render();" 
                                class="whitespace-nowrap px-4 py-2 rounded-xl text-sm font-medium transition ${state.activeCategory === cat ? 'bg-teal-700 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>
                </header>

                <!-- HERO BANNER / WELCOME -->
                <section class="max-w-6xl mx-auto px-4 py-6 w-full">
                    <div class="bg-gradient-to-r from-teal-800 to-teal-900 rounded-3xl p-6 md:p-10 text-white shadow-md flex flex-col md:flex-row items-center justify-between gap-6">

                            <p class="text-teal-100 text-sm md:text-base max-w-xl">Comprá directo a emprendedores locales por WhatsApp. ¿No tienen envío? Usá nuestro servicio de cadetería <b class="text-amber-300">FLASH</b>.</p>
                        </div>
                        <div class="flex flex-col gap-3 w-full md:w-auto">
                            ${!state.session ? `<button onclick="openAuthModal('register')" class="bg-white text-teal-900 font-bold px-6 py-3 rounded-2xl shadow hover:bg-slate-100 transition text-center">Registrar mi Tienda Gratis</button>` : ''}
                            <a href="#mi-tienda" class="bg-teal-700 text-white font-semibold px-6 py-3 rounded-2xl border border-teal-600 hover:bg-teal-600 transition text-center">Gestionar Mi Local</a>
                        </div>
                    </div>
                </section>

                <!-- PRODUCTS GRID -->
                <main class="max-w-6xl mx-auto px-4 py-4 flex-1 w-full">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-800">Catálogo General (${filteredProducts.length})</h2>
                    </div>

                    ${filteredProducts.length === 0 ? `
                        <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 shadow-sm p-8">
                            <span class="text-4xl mb-2 block">🛍️</span>
                            <h3 class="text-lg font-bold text-slate-700">No se encontraron productos</h3>
                            <p class="text-slate-500 text-sm mt-1">Probá cambiando de categoría o buscando otro término.</p>
                        </div>
                    ` : `
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            ${filteredProducts.map(p => {
                                const vendor = state.users.find(u => u.email === p.vendorEmail) || { nombreTienda: 'Local Local', slug: '#' };
                                const fotos = p.fotos && p.fotos.length > 0 ? p.fotos : ['https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'];
                                const cId = 'prod_card_' + p.id;
                                return `
                                    <div onclick="openProductModal('${p.id}')" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition">
                                        <!-- Card Carousel / Image -->
                                        <div class="relative h-40 bg-slate-100 carousel-container overflow-hidden" data-carousel-id="${cId}">
                                            ${fotos.map((f, i) => `
                                                <div class="carousel-slide w-full h-full" style="display: ${i===0?'block':'none'}">
                                                    <img src="${f}" alt="${p.nombre}" class="w-full h-full object-cover">
                                                </div>
                                            `).join('')}
                                            ${fotos.length > 1 ? `
                                                <div class="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5 z-10">
                                                    ${fotos.map((_, i) => `<span class="carousel-dot w-1.5 h-1.5 rounded-full ${i===0?'bg-white':'bg-white/50'}"></span>`).join('')}
                                                </div>
                                            ` : ''}
                                            <span class="absolute top-2 left-2 bg-teal-900/80 text-white text-[10px] px-2 py-0.5 rounded-lg font-medium">${p.categoria}</span>
                                        </div>
                                        <div class="p-3 flex flex-col flex-1 justify-between">
                                            <div>
                                                <span class="text-[11px] text-teal-700 font-semibold block truncate">${vendor.nombreTienda}</span>
                                                <h3 class="text-sm font-bold text-slate-800 line-clamp-1">${p.nombre}</h3>
                                                <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${p.descripcion || ''}</p>
                                            </div>
                                            <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
                                                <span class="text-base font-extrabold text-slate-900">$${Number(p.precio).toLocaleString('es-AR')}</span>
                                                <span class="text-xs bg-teal-50 text-teal-800 px-2 py-1 rounded-xl font-medium">Ver más</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </main>

                <!-- FOOTER -->
                <footer class="bg-white border-t border-slate-200 mt-12 py-8 text-center text-sm text-slate-500">
                    <p class="font-semibold text-teal-800">Tres Arroyos Market 🛒</p>
                    <p class="mt-1">El punto de encuentro digital para el comercio local de Tres Arroyos.</p>
                </footer>
            `;
        }

        // ==========================================
        // 2. TIENDA PÚBLICA VIEW (#t/{slug})
        // ==========================================
        function renderTiendaPublicaView() {
            const vendor = state.users.find(u => u.slug === state.activeSlug);
            if (!vendor) {
                return `
                    <div class="max-w-md mx-auto px-4 py-20 text-center">
                        <span class="text-5xl mb-4 block">🔍</span>
                        <h2 class="text-xl font-bold text-slate-800">Tienda no encontrada</h2>
                        <p class="text-slate-500 text-sm mt-2">El enlace ingresado no corresponde a ningún comercio activo en Tres Arroyos Market.</p>
                        <a href="#" class="mt-6 inline-block bg-teal-700 text-white font-medium px-6 py-3 rounded-2xl">Volver al Catálogo General</a>
                    </div>
                `;
            }

            const primaryColor = vendor.catalogo && vendor.catalogo.color ? vendor.catalogo.color : '#0f766e';
            document.documentElement.style.setProperty('--primary-color', primaryColor);

            const prods = state.products.filter(p => p.vendorEmail === vendor.email && p.activo !== false);
            const bannerFotos = vendor.fotosCarrusel && vendor.fotosCarrusel.length > 0 ? vendor.fotosCarrusel : (vendor.fotoPortada ? [vendor.fotoPortada] : ['https://images.unsplash.com/photo-1557804506-669a67965ba0?w=1200']);
            const catalogoConfig = vendor.catalogo || { titulo: 'Catálogo de Productos', desc: '¡Bienvenidos a nuestra tienda online!', bienvenida: '¡Gracias por apoyar el comercio local!', mostrarInfo: 'Si' };
            
            const destacadosIds = catalogoConfig.destacadosIds || [];
            const destacadosProds = prods.filter(p => destacadosIds.includes(p.id));
            const restoProds = prods.filter(p => !destacadosIds.includes(p.id));

            return `
                <!-- HEADER PUBLIC STORE -->
                <header class="bg-white shadow-sm sticky top-0 z-40">
                    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">

                            <div class="carousel-slide w-full h-full" style="display: ${i===0?'block':'none'}">
                                <img src="${f}" class="w-full h-full object-cover">
                            </div>
                        `).join('')}
                        ${bannerFotos.length > 1 ? `
                            <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-2 z-10">
                                ${bannerFotos.map((_, i) => `<span class="carousel-dot w-2 h-2 rounded-full ${i===0?'bg-white':'bg-white/50'}"></span>`).join('')}
                            </div>
                        ` : ''}
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                        
                        <!-- Profile Avatar Overlap -->
                        <div class="absolute bottom-4 left-4 flex items-center gap-4 z-20">
                            <img src="${vendor.fotoPerfil || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200'}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border-2 border-white shadow-lg bg-white">
                            <div class="text-white drop-shadow">
                                <h1 class="text-xl sm:text-2xl font-extrabold">${vendor.nombreTienda}</h1>
                                <p class="text-xs text-teal-100 flex items-center gap-1">📍 ${vendor.zona} ${vendor.vehiculo === 'Si' ? '• 🚚 Con envío propio' : '• ⚡ Envío por Flash'}</p>
                            </div>
                        </div>
                    </div>

                    <!-- STORE INFO & WELCOME -->
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <div class="bg-teal-50 border border-teal-100 rounded-2xl p-4 text-teal-900 text-sm">
                            <p class="font-bold mb-1">👋 ${catalogoConfig.bienvenida}</p>
                            <p class="text-slate-600">${vendor.descripcion || catalogoConfig.desc}</p>
                        </div>

                        ${catalogoConfig.mostrarInfo === 'Si' ? `

        function openAuthModal(tab = 'login') {
            state.authModalOpen = true;
            state.authTab = tab;
            render();
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const email = fd.get('email').trim();
            if (state.users.some(u => u.email === email)) {
                showToast("El email ya está registrado", "error");
                return;
            }

            const nombreTienda = fd.get('nombreTienda');
            const slug = nombreTienda.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-' + Math.random().toString(36).substring(2, 6);

            const newUser = {
                id: 'user_' + Date.now(),
                nombreTienda,
                dueño: fd.get('dueño'),
                email,
                wsp: fd.get('wsp'),
                password: fd.get('password'),
                zona: fd.get('zona'),
                vehiculo: fd.get('vehiculo'),
                slug,
                fotoPerfil: '',
                fotosCarrusel: [],
                catalogo: { titulo: 'Catálogo ' + nombreTienda, desc: 'Envíos en el día en Tres Arroyos', bienvenida: '¡Gracias por elegirnos!', color: '#0f766e', destacadosIds: [], mostrarInfo: 'Si' }
            };

            state.users.push(newUser);
            state.session = { email: newUser.email };
            state.authModalOpen = false;
            saveLocal();
            syncWithSheets('register_user', newUser);
            showToast("¡Tienda registrada con éxito!");
            window.location.hash = '#mi-tienda';
        }

        function handleLogin(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const email = fd.get('email').trim();
            const pass = fd.get('password');

            const user = state.users.find(u => u.email === email && u.password === pass);
            if (user) {
                state.session = { email: user.email };
                state.authModalOpen = false;
                saveLocal();
                showToast("¡Sesión iniciada!");
                window.location.hash = '#mi-tienda';
            } else {
                showToast("Email o contraseña incorrectos", "error");
            }
        }

        function logout() {
            state.session = null;
            saveLocal();
            showToast("Sesión cerrada");
            window.location.hash = '';
        }

        async function handleCreateProduct(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const fotosInput = document.getElementById('new-prod-fotos');
            let fotos = [];
            if (fotosInput && fotosInput.files.length > 0) {
                fotos = await compressMultiple(fotosInput.files, 4);
            }

            const newProd = {
                id: 'prod_' + Math.random().toString(36).substring(2, 6),
                vendorEmail: state.session.email,
                nombre: fd.get('nombre'),
                precio: Number(fd.get('precio')),
                categoria: fd.get('categoria'),
                descripcion: fd.get('descripcion'),
                stock: fd.get('stock') === 'Si',
                envioPropio: fd.get('envioPropio') === 'Si',
                fotos,
                activo: true
            };

            state.products.push(newProd);
            saveLocal();
            syncWithSheets('create_product', newProd);
            showToast("¡Producto publicado con éxito!");
            e.target.reset();
            render();
        }

        function toggleProductStatus(id) {
            const p = state.products.find(prod => prod.id === id);
            if (p) {
                p.activo = p.activo === false ? true : false;
                saveLocal();
                syncWithSheets('update_product', p);
                render();
            }
        }

        function deleteProduct(id) {
            if (confirm("¿Estás seguro de borrar este producto?")) {
                state.products = state.products.filter(p => p.id !== id);
                saveLocal();
                syncWithSheets('delete_product', { id });
                showToast("Producto eliminado");
                render();
            }
        }

        function openEditProductModal(id) {
            state.editProductModal = id;
            render();
        }

        async function handleUpdateProduct(e, id) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const p = state.products.find(prod => prod.id === id);
            if (!p) return;

            p.nombre = fd.get('nombre');
            p.precio = Number(fd.get('precio'));
            p.categoria = fd.get('categoria');
            p.descripcion = fd.get('descripcion');

            const fotosInput = e.target.querySelector('input[type="file"]');
            if (fotosInput && fotosInput.files.length > 0) {
                p.fotos = await compressMultiple(fotosInput.files, 4);
            }

            state.editProductModal = null;
            saveLocal();
            syncWithSheets('update_product', p);
            showToast("Producto actualizado");
            render();
        }

        function openEditStoreModal() {
            state.editStoreModalOpen = true;
            render();
        }

        async function handleSaveStore(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const v = state.users.find(u => u.email === state.session.email);
            if (!v) return;

            v.nombreTienda = fd.get('nombreTienda');
            v.descripcion = fd.get('descripcion');
            v.direccion = fd.get('direccion');
            v.zona = fd.get('zona');
            v.wsp = fd.get('wsp');
            v.instagram = fd.get('instagram');
            v.horario = fd.get('horario');
            v.vehiculo = fd.get('vehiculo');

            const fotoPerfilInput = e.target.querySelector('input[name="fotoPerfil"]');
            if (fotoPerfilInput && fotoPerfilInput.files.length > 0) {
                v.fotoPerfil = await compressImage(fotoPerfilInput.files[0], 400, 0.7);
            }

            const fotosCarruselInput = e.target.querySelector('input[name="fotosCarrusel"]');
            if (fotosCarruselInput && fotosCarruselInput.files.length > 0) {
                v.fotosCarrusel = await compressMultiple(fotosCarruselInput.files, 6);
            }

            state.editStoreModalOpen = false;
            saveLocal();
            syncWithSheets('update_user', v);
            showToast("¡Tienda actualizada correctamente!");
            render();
        }

        function openEditCatalogModal() {
            state.editCatalogModalOpen = true;
            render();
        }

        async function handleSaveCatalog(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const v = state.users.find(u => u.email === state.session.email);
            if (!v) return;

            const destacadosIds = Array.from(e.target.querySelectorAll('input[name="destacado"]:checked')).map(cb => cb.value);

            v.catalogo = {
                titulo: fd.get('titulo'),
                desc: fd.get('desc'),
                bienvenida: fd.get('bienvenida'),
                color: fd.get('color'),
                mostrarInfo: fd.get('mostrarInfo'),
                destacadosIds
            };

            state.editCatalogModalOpen = false;
            saveLocal();
            syncWithSheets('update_user', v);
            showToast("¡Catálogo actualizado!");
            render();
        }

        function openProductModal(id) {
            state.selectedProductModal = id;
            state.checkoutData = { cant: 1, cliente: '', direccion: '', nota: '', flash: false };
            render();
        }

        function enviarPedidoWhatsApp(productId) {
            const p = state.products.find(prod => prod.id === productId);
            const vendor = state.users.find(u => u.email === p.vendorEmail);
            if (!p || !vendor) return;

            const cant = state.checkoutData.cant;
            const cliente = state.checkoutData.cliente.trim() || 'Cliente';
            const direccion = state.checkoutData.direccion.trim() || 'Tres Arroyos';
            const nota = state.checkoutData.nota.trim();
            const flash = state.checkoutData.flash;

            const subtotal = p.precio * cant;
            const flashFee = flash ? 2000 : 0;
            const totalCliente = subtotal + flashFee;

            let mensaje = `Hola ${vendor.nombreTienda}! Nuevo pedido de Tres Arroyos Market:\n📦 ${p.nombre} x${cant} - $${subtotal.toLocaleString('es-AR')}\n👤 Cliente: ${cliente}\n📍 Dirección: ${direccion}`;
            if (nota) mensaje += `\n📝 Nota: ${nota}`;
            if (flash) {
                mensaje += `\n🚚 FLASH: SI (Comisión 10% + Viaje $2000). Coordinar con central: +549${CENTRAL_WSP}`;
            } else {
                mensaje += `\n🚚 Envío propio del local.`;
            }
            mensaje += `\nTotal cliente: $${totalCliente.toLocaleString('es-AR')}`;

            // Save order locally and sync
            const newOrder = {
                id: 'ord_' + Date.now(),
                vendorEmail: vendor.email,
                tiendaNombre: vendor.nombreTienda,
                productoId: p.id,
                productoNombre: p.nombre,
                cantidad: cant,
                subtotal,
                totalCliente,
                cliente,
                direccion,
                nota,
                flash,
                fecha: new Date().toISOString()
            };

            state.orders.push(newOrder);
            saveLocal();
            syncWithSheets('create_order', newOrder);

            // Open WhatsApp Vendor
            window.open(`https://wa.me/549${vendor.wsp}?text=${encodeURIComponent(mensaje)}`, '_blank');

            // If flash, also open central
            if (flash) {
                setTimeout(() => {
                    window.open(`https://wa.me/${CENTRAL_WSP}?text=${encodeURIComponent('CENTRAL FLASH - Nuevo pedido:\n' + mensaje)}`, '_blank');
                }, 1500);
            }

            state.selectedProductModal = null;
            showToast("¡Pedido enviado por WhatsApp!");
            render();
        }

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            fetchAllFromSheets();
            handleRoute();
            // Periodic sync check every 15 sec
            setInterval(() => {
                if (state.pendingSync.length > 0 && state.isOnline) {
                    let item = state.pendingSync.shift();
                    syncWithSheets(item.action, item.payload);
                }
            }, 15000);
        });
    </script>
</body>
</html>
